services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: dashboard-local:latest
    container_name: dashboard-app
    restart: unless-stopped
    ports:
      - '8080:8080'
    env_file:
      - .env
    environment:
      - PORT=8080
      - BODY_SIZE_LIMIT=0
      - GITHUB_TOKEN
    volumes:
      # Persists git mirrors, cached state, and SQLite DBs locally
      - ./data:/app/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8080/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
